openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Gestão de Pedidos API
  version: 1.0.0
  summary: API REST do sistema de gestão para revendedora de cosméticos.
  description: API First utilizada pelo frontend Next.js e por integrações externas. As operações críticas são transacionais,
    auditadas e aceitam idempotência quando indicado.
  contact:
    name: Equipe do projeto
  license:
    name: Proprietary
servers:
- url: http://localhost:3001/api/v1
  description: Desenvolvimento local
- url: https://{host}/api/v1
  description: Produção
  variables:
    host:
      default: api.exemplo.com
      description: Host público configurado na Railway
tags:
- name: Health
  description: Saúde e prontidão da aplicação.
- name: Auth
  description: Autenticação e sessão de usuários.
- name: Users
  description: Operações administrativas de usuários.
- name: Brands
  description: Cadastro de marcas.
- name: Categories
  description: Cadastro de categorias.
- name: Products
  description: Catálogo de produtos.
- name: Orders
  description: Pedidos de compra e recebimento.
- name: Inventory
  description: Saldo e movimentações de estoque.
- name: Customers
  description: Cadastro opcional de clientes.
- name: Sales
  description: Vendas e recibos.
- name: Reports
  description: Relatórios operacionais.
- name: Integrations
  description: API Keys e importações assistidas.
paths:
  /health:
    get:
      tags:
      - Health
      summary: Verificar saúde da aplicação
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Aplicação disponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      tags:
      - Health
      summary: Verificar prontidão da aplicação e banco
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Aplicação pronta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Dependência indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Autenticar usuário
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSummary'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
