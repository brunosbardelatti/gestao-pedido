services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestao_pedidos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_pedidos"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-e2e:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: gestao_pedidos_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_pedidos_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
