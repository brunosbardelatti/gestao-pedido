  /integrations/api-keys:
    get:
      tags:
      - Integrations
      summary: Listar API Keys
      operationId: listApiKeys
      security:
      - cookieAuth: []
      responses:
        '200':
          description: API Keys sem segredo.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Integrations
      summary: Criar API Key
      operationId: createApiKey
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Chave criada. O segredo é exibido uma única vez.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CreateApiKeyResponse'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
        '409':
          $ref: '#/components/responses/Conflict'
  /integrations/api-keys/{id}:
    delete:
      tags:
      - Integrations
      summary: Revogar API Key
      operationId: revokeApiKey
      security:
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: API Key revogada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
  /integrations/nfe-xml:
    post:
      tags:
      - Integrations
      summary: Importar XML de NF-e
      operationId: importNfeXml
      description: Cria um rascunho para revisão humana. Não recebe pedido nem altera estoque.
      security:
      - cookieAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  contentMediaType: application/xml
                  contentEncoding: binary
      responses:
        '201':
          description: Rascunho criado.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ImportedOrderDraft'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
        '409':
          $ref: '#/components/responses/Conflict'
  /integrations/imported-orders/{id}/approve:
    post:
      tags:
      - Integrations
      summary: Aprovar pedido importado
      operationId: approveImportedOrder
      description: Converte o rascunho revisado em pedido OPEN. Não altera estoque.
      security:
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveImportedOrderRequest'
      responses:
        '201':
          description: Pedido aberto criado.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Cookie HTTP-only, Secure e SameSite configurado após login.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Chave de integração. O servidor persiste apenas o hash.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Página solicitada.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Quantidade de registros por página.
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
      description: Busca textual.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Identificador único da tentativa. Repetições retornam o resultado previamente persistido.
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
      description: Identificador de correlação opcional.
  headers:
    RequestId:
      description: Identificador de correlação da requisição.
      schema:
        type: string
  responses:
    BadRequest:
      description: Requisição inválida.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Não autenticado.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Operação não permitida.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Recurso não encontrado.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflito de unicidade, estado ou idempotência.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BusinessRuleViolation:
      description: Regra de negócio violada.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Erro interno sem exposição de stack trace.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
    Date:
      type: string
      format: date
    DateTime:
      type: string
      format: date-time
    Money:
      type: string
      pattern: ^\d+(\.\d{1,2})?$
      examples:
      - '49.90'
      description: Valor decimal serializado como string para evitar perda de precisão.
    PaginationMeta:
      type: object
      required:
      - page
      - pageSize
      - total
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          examples:
          - ORDER_NOT_FOUND
        message:
          type: string
          examples:
          - Pedido não encontrado.
        field:
          type:
          - string
          - 'null'
        details:
          type:
          - object
          - array
          - 'null'
        requestId:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
    UserRole:
      type: string
      enum:
      - ADMIN
      - OPERATOR
    OrderStatus:
      type: string
      enum:
      - OPEN
      - RECEIVED
      - CANCELED
    SaleStatus:
      type: string
      enum:
      - COMPLETED
      - CANCELED
    PaymentMethod:
      type: string
      enum:
      - CASH
      - PIX
      - DEBIT_CARD
      - CREDIT_CARD
      - BANK_TRANSFER
      - OTHER
    InventoryMovementType:
      type: string
      enum:
      - PURCHASE
      - SALE
      - SALE_CANCELLATION
      - CORRECTION
      - PERSONAL_USE
      - RETURN
    ApiKeyStatus:
      type: string
      enum:
      - ACTIVE
      - REVOKED
    UserSummary:
      type: object
      required:
      - id
      - name
      - login
      - role
      - active
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        login:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
      additionalProperties: false
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 8
          maxLength: 128
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      required:
      - newPassword
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      additionalProperties: false
    ActivePatch:
      type: object
      required:
      - active
      properties:
        active:
          type: boolean
      additionalProperties: false
    Brand:
      type: object
      required:
      - id
      - name
      - active
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        active:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    BrandInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      additionalProperties: false
    Category:
      type: object
      required:
      - id
      - name
      - active
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        active:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    CategoryInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      additionalProperties: false
    Product:
      type: object
      required:
      - id
      - brand
      - category
      - code
      - description
      - catalogPrice
      - purchasePrice
      - originalPrice
      - suggestedSalePrice
      - active
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        brand:
          $ref: '#/components/schemas/Brand'
        category:
          $ref: '#/components/schemas/Category'
        code:
          type: string
        description:
          type: string
        catalogPrice:
          $ref: '#/components/schemas/Money'
        purchasePrice:
          $ref: '#/components/schemas/Money'
        originalPrice:
          $ref: '#/components/schemas/Money'
        suggestedSalePrice:
          $ref: '#/components/schemas/Money'
        active:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    ProductInput:
      type: object
      required:
      - brandId
      - categoryId
      - code
      - description
      - catalogPrice
      - purchasePrice
      - originalPrice
      - suggestedSalePrice
      properties:
        brandId:
          $ref: '#/components/schemas/Uuid'
        categoryId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 255
        catalogPrice:
          $ref: '#/components/schemas/Money'
        purchasePrice:
          $ref: '#/components/schemas/Money'
        originalPrice:
          $ref: '#/components/schemas/Money'
        suggestedSalePrice:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    OrderItem:
      type: object
      required:
      - id
      - productId
      - productCode
      - productDescription
      - quantityOrdered
      - quantityReceived
      - catalogUnitPrice
      - purchaseUnitPrice
      - originalUnitPrice
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        productId:
          $ref: '#/components/schemas/Uuid'
        productCode:
          type: string
        productDescription:
          type: string
        quantityOrdered:
          type: integer
          minimum: 1
        quantityReceived:
          type: integer
          minimum: 0
        catalogUnitPrice:
          $ref: '#/components/schemas/Money'
        purchaseUnitPrice:
          $ref: '#/components/schemas/Money'
        originalUnitPrice:
          $ref: '#/components/schemas/Money'
        expirationDate:
          oneOf:
          - $ref: '#/components/schemas/Date'
          - type: 'null'
        notes:
          type:
          - string
          - 'null'
      additionalProperties: false
    Order:
      type: object
      required:
      - id
      - brand
      - cycle
      - orderDate
      - status
      - items
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        brand:
          $ref: '#/components/schemas/Brand'
        cycle:
          type: string
        orderDate:
          $ref: '#/components/schemas/Date'
        receivedAt:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        canceledAt:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        cancelReason:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/OrderStatus'
        notes:
          type:
          - string
          - 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          minItems: 1
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    CreateOrderItemInput:
      type: object
      required:
      - productId
      - quantityOrdered
      - catalogUnitPrice
      - purchaseUnitPrice
      - originalUnitPrice
      properties:
        productId:
          $ref: '#/components/schemas/Uuid'
        quantityOrdered:
          type: integer
          minimum: 1
        catalogUnitPrice:
          $ref: '#/components/schemas/Money'
        purchaseUnitPrice:
          $ref: '#/components/schemas/Money'
        originalUnitPrice:
          $ref: '#/components/schemas/Money'
        notes:
          type:
          - string
          - 'null'
          maxLength: 500
      additionalProperties: false
    CreateOrderRequest:
      type: object
      required:
      - brandId
      - cycle
      - orderDate
      - items
      properties:
        brandId:
          $ref: '#/components/schemas/Uuid'
        cycle:
          type: string
          minLength: 1
          maxLength: 80
        orderDate:
          $ref: '#/components/schemas/Date'
        notes:
          type:
          - string
          - 'null'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemInput'
      additionalProperties: false
    ReceiveOrderItemInput:
      type: object
      required:
      - orderItemId
      - quantityReceived
      properties:
        orderItemId:
          $ref: '#/components/schemas/Uuid'
        quantityReceived:
          type: integer
          minimum: 0
        expirationDate:
          oneOf:
          - $ref: '#/components/schemas/Date'
          - type: 'null'
        notes:
          type:
          - string
          - 'null'
          maxLength: 500
      additionalProperties: false
    ReceiveOrderRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReceiveOrderItemInput'
      additionalProperties: false
    CancelRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    InventoryBalance:
      type: object
      required:
      - productId
      - productCode
      - description
      - brandName
      - balance
      properties:
        productId:
          $ref: '#/components/schemas/Uuid'
        productCode:
          type: string
        description:
          type: string
        brandName:
          type: string
        balance:
          type: integer
        suggestedSalePrice:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    InventoryMovement:
      type: object
      required:
      - id
      - productId
      - type
      - quantityDelta
      - createdAt
      - createdBy
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        productId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/InventoryMovementType'
        quantityDelta:
          type: integer
          not:
            const: 0
        reason:
          type:
          - string
          - 'null'
        orderItemId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        saleItemId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    InventoryAdjustmentRequest:
      type: object
      required:
      - productId
      - type
      - quantityDelta
      - reason
      properties:
        productId:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum:
          - CORRECTION
          - PERSONAL_USE
          - RETURN
        quantityDelta:
          type: integer
          not:
            const: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
        confirmNegativeStock:
          type: boolean
          default: false
      additionalProperties: false
    Customer:
      type: object
      required:
      - id
      - name
      - active
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        cpf:
          type:
          - string
          - 'null'
          pattern: ^\d{11}$
        phone:
          type:
          - string
          - 'null'
        addressLine:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
        postalCode:
          type:
          - string
          - 'null'
          pattern: ^\d{8}$
        active:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    CustomerInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        cpf:
          type:
          - string
          - 'null'
          pattern: ^\d{11}$
        phone:
          type:
          - string
          - 'null'
          maxLength: 20
        addressLine:
          type:
          - string
          - 'null'
          maxLength: 255
        city:
          type:
          - string
          - 'null'
          maxLength: 100
        state:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
        postalCode:
          type:
          - string
          - 'null'
          pattern: ^\d{8}$
      additionalProperties: false
    SaleItem:
      type: object
      required:
      - id
      - productId
      - productCode
      - productDescription
      - quantity
      - unitPrice
      - unitCostSnapshot
      - subtotal
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        productId:
          $ref: '#/components/schemas/Uuid'
        productCode:
          type: string
        productDescription:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        unitCostSnapshot:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    Sale:
      type: object
      required:
      - id
      - status
      - saleDate
      - total
      - items
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        customer:
          oneOf:
          - $ref: '#/components/schemas/Customer'
          - type: 'null'
        status:
          $ref: '#/components/schemas/SaleStatus'
        saleDate:
          $ref: '#/components/schemas/DateTime'
        paymentMethod:
          oneOf:
          - $ref: '#/components/schemas/PaymentMethod'
          - type: 'null'
        total:
          $ref: '#/components/schemas/Money'
        notes:
          type:
          - string
          - 'null'
        canceledAt:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        cancelReason:
          type:
          - string
          - 'null'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleItem'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    CreateSaleItemInput:
      type: object
      required:
      - productId
      - quantity
      - unitPrice
      properties:
        productId:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    CreateSaleRequest:
      type: object
      required:
      - items
      properties:
        customerId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        paymentMethod:
          oneOf:
